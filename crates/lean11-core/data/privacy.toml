# --- network checks and peer downloads ---------------------------------------------------------------

[[category]]
id = "network-checks"
title = "Connectivity checks and peer downloads"
parent = "data-collection"

[[setting]]
id = "delivery-optimization-http-only"
category = "network-checks"
title = "No peer-to-peer downloads for updates and apps"
description = """Windows Update and the Store download only from Microsoft, never from or to other PCs on the \
network or the internet."""
level = "recommended"
verified = "ADMX DeliveryOptimization.admx DownloadMode (0 = HTTP only)"
note = "Non-policy copies (Config, NetworkService profile, per-user switch) are not set; the NetworkService profile does not exist offline anyway."
conflicts = ["delivery-optimization-lan-only"]
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization', name = "DODownloadMode", dword = 0 }]

[[setting]]
id = "connectivity-probe-off"
category = "network-checks"
title = "No connectivity checks with Microsoft servers"
description = """Windows no longer contacts msftconnecttest.com to test for internet access, neither actively \
nor passively, and the check hosts are blocked. Costs: the network icon may show "No internet" although there \
is a connection, and captive portal sign-in pages (hotels, trains) do not open on their own."""
level = "optional"
verified = "ADMX ICM.admx NoActiveProbe, NCSI.admx NCSI_PassivePolling; hosts entries"
note = "NlaSvc and netprofm stay on: without them Windows cannot identify networks and the firewall treats every network as public."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator', name = "NoActiveProbe", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\NetworkConnectivityStatusIndicator', name = "DisablePassivePolling", dword = 1 },
  { hosts = ["msftncsi.com", "dns.msftncsi.com", "ipv6.msftncsi.com", "msftconnecttest.com", "www.msftconnecttest.com", "ipv6.msftconnecttest.com"] },
]

