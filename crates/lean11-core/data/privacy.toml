category = "media"
title = "Windows Media Player Legacy goes not online"
description = """The legacy Windows Media Player retrieves no CD, DVD and music metadata or radio presets from the internet and does not share media on the network."""
level = "recommended"
hidden_if = ["option:legacy-capabilities"]
verified = "ADMX WindowsMediaPlayer.admx PreventCDDVDMetadataRetrieval, PreventMusicFileMetadataRetrieval, PreventRadioPresetsRetrieval (user); service WMPNetworkSvc present in the 26H2 image"
note = "The UsageTracking preference (no policy) dropped. Hidden when Components removes the legacy Media Player."
ops = [
  { reg = 'HKCU\Software\Policies\Microsoft\WindowsMediaPlayer', name = "PreventCDDVDMetadataRetrieval", dword = 1 },
  { reg = 'HKCU\Software\Policies\Microsoft\WindowsMediaPlayer', name = "PreventMusicFileMetadataRetrieval", dword = 1 },
  { reg = 'HKCU\Software\Policies\Microsoft\WindowsMediaPlayer', name = "PreventRadioPresetsRetrieval", dword = 1 },
  { service = "WMPNetworkSvc", start = 4 },
]

# --- Windows Update ------------------------------------------------------------------------------------
# Switching Windows Update off is the Components option disable-windows-update; these settings refine it
# and are hidden when it is off.

[[setting]]
id = "telemetry-programs-firewall"
category = "telemetry"
title = "Firewall blocks the telemetry programs"
description = """Windows Firewall blocks outgoing traffic of the compatibility telemetry runner, the device census \
and the CEIP data consolidator, so they send nothing even when started. The rules can be switched off in Windows \
Defender Firewall."""
level = "recommended"
verified = "CompatTelRunner.exe, DeviceCensus.exe and wsqmcons.exe present in the 26H2 image; rule format of the image's own FirewallRules (v2.33)"
note = """No rules for programs whose blocking breaks Windows Update (MoUsoCoreWorker), activation, SmartScreen, \
Defender tools, account sign-in (CloudExperienceHost) or app infrastructure (RuntimeBroker, taskhostw, \
BackgroundTaskHost), for apps lean11 removes, or for packaged apps a path rule may not match (SearchHost)."""
ops = [
  { firewall_block = '%SystemRoot%\System32\CompatTelRunner.exe' },
  { firewall_block = '%SystemRoot%\System32\DeviceCensus.exe' },
  { firewall_block = '%SystemRoot%\System32\wsqmcons.exe' },
]

[[setting]]
id = "error-reporting-firewall"
category = "error-reporting"
title = "Firewall blocks the error reporting programs"
description = """Windows Firewall blocks outgoing traffic of the Windows Error Reporting programs (WerFault, \
WerFaultSecure and the report queue manager wermgr, 64- and 32-bit), as a second line besides turning error reporting \
off. Costs: no online solutions for problems."""
level = "strict"
sources = ["wermgr.exe and the 32-bit copies"]
verified = "WerFault.exe, WerFaultSecure.exe and wermgr.exe present in System32 and SysWOW64 of the 26H2 image; rule format of the image's own FirewallRules (v2.33)"
ops = [
  { firewall_block = '%SystemRoot%\System32\WerFault.exe' },
  { firewall_block = '%SystemRoot%\System32\WerFaultSecure.exe' },
  { firewall_block = '%SystemRoot%\System32\wermgr.exe' },
  { firewall_block = '%SystemRoot%\SysWOW64\WerFault.exe' },
  { firewall_block = '%SystemRoot%\SysWOW64\WerFaultSecure.exe' },
  { firewall_block = '%SystemRoot%\SysWOW64\wermgr.exe' },
]

[[category]]
id = "office"
title = "Microsoft Office (when installed later)"
description = "Policies that Microsoft 365 Apps and Office 2016 or newer read once they are installed. Nothing of Office is in the image."

[[setting]]
id = "office-telemetry-off"
category = "office"
title = "Office sends no optional diagnostic data"
description = """Office sends neither optional nor required diagnostic data, takes no part in the Customer \
Experience Improvement Program, sends no personal information and its telemetry agent neither logs nor uploads."""
level = "recommended"
verified = "Office ADMX 5568.1000 (office16.admx): L_SendTelemetry (3 = Neither), L_EnableCustomerExperienceImprovementProgram, L_Sendcustomerdata, L_EnableLogging, L_OfficeInventoryAgentUpload"
note = "ClientTelemetry!DisableTelemetry and Office 15.0 keys are not used: no policy defines them and Office 2013 is out of support. SendCustomerData only applies to volume licensed Office 2016/2019 (Microsoft Learn: replaced in Microsoft 365 Apps since version 1904)."
ops = [
  { reg = 'HKCU\Software\Policies\Microsoft\Office\Common\ClientTelemetry', name = "SendTelemetry", dword = 3 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common', name = "QMEnable", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common', name = "SendCustomerData", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM', name = "EnableLogging", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\OSM', name = "EnableUpload", dword = 0 },
]

[[setting]]
id = "office-feedback-off"
category = "office"
title = "No Office feedback and surveys"
description = "Office offers no feedback button (Send a Smile) and no in-product surveys, and sends no screenshots, logs or e-mail address with feedback."
level = "recommended"
verified = "Office ADMX 5568.1000 (office16.admx): L_SendFeedback, L_SendSurvey, L_Screenshot, L_LogCollection, L_EmailCollection"
note = "Uses the policy key, not Office\\16.0\\Common\\Feedback outside the Policies branch."
ops = [
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Feedback', name = "Enabled", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Feedback', name = "SurveyEnabled", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Feedback', name = "IncludeScreenshot", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Feedback', name = "FeedbackIncludeLog", dword = 0 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Feedback', name = "IncludeEmail", dword = 0 },
]

[[setting]]
id = "office-optional-connected-off"
category = "office"
title = "No optional connected experiences in Office"
description = """Turns off Office's optional online extras that Microsoft offers under its consumer services \
agreement (for example 3D Maps in Excel, which uses Bing) and the LinkedIn features. Core features, co-authoring \
and OneDrive storage keep working."""
level = "recommended"
sources = ["Microsoft Learn \"Use policy settings to manage privacy controls for Microsoft 365 Apps\""]
verified = "Office ADMX 5568.1000 (office16.admx): L_OptionalConnectedExperiences (2 = disabled), L_AllowLinkedInFeatures"
ops = [
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Privacy', name = "ControllerConnectedServicesEnabled", dword = 2 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common', name = "LinkedIn", dword = 0 },
]

[[setting]]
id = "office-content-services-off"
category = "office"
title = "Office does not send or download content for online services"
description = """Office does not send document content to online services that analyze it, and does not download \
online content. Costs: no Designer, online translation, Editor suggestions, online pictures and templates."""
level = "strict"
sources = ["Microsoft Learn \"Use policy settings to manage privacy controls for Microsoft 365 Apps\""]
verified = "Office ADMX 5568.1000 (office16.admx): L_OfficeExperiencesAnlayzingContent and L_OfficeExperiencesDownloadingContent (2 = disabled)"
ops = [
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Privacy', name = "UserContentDisabled", dword = 2 },
  { reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Privacy', name = "DownloadContentDisabled", dword = 2 },
]

[[setting]]
id = "office-connected-off"
category = "office"
title = "No connected experiences in Office at all"
description = """Turns off most of Office's online features at once. Costs: besides the above also \
co-authoring, online file storage (OneDrive, SharePoint) and Copilot in Office. Mail sync in Outlook, Teams and \
licensing keep working."""
level = "optional"
sources = ["Microsoft Learn \"Use policy settings to manage privacy controls for Microsoft 365 Apps\""]
verified = "Office ADMX 5568.1000 (office16.admx): L_ConnectedOfficeExperiences (2 = disabled)"
ops = [{ reg = 'HKCU\Software\Policies\Microsoft\Office\16.0\Common\Privacy', name = "DisconnectedState", dword = 2 }]

[[category]]
id = "updates"
title = "Windows Update"

[[setting]]
id = "device-metadata-off"
category = "updates"
title = "No device metadata from the internet"
description = "Windows does not download device pictures, names and descriptions for connected hardware from Microsoft."
level = "recommended"
verified = "ADMX DeviceSetup.admx DeviceMetadata_PreventDeviceMetadataFromNetwork"
note = "DeviceMetadataServiceURL and event channel changes (no policy) are not set."
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Device Metadata', name = "PreventDeviceMetadataFromNetwork", dword = 1 }]

[[setting]]
id = "update-drivers-off"
category = "updates"
title = "No drivers through Windows Update"
description = """Windows Update installs no drivers, and Windows does not search Windows Update for drivers of \
new devices. Costs: drivers for new hardware must be installed by hand."""
level = "strict"
hidden_if = ["updates-off"]
verified = "ADMX WindowsUpdate.admx ExcludeWUDriversInQualityUpdate; DeviceSetup.admx DriverSearchPlaces_SearchOrderConfiguration, DriverSearchPlaces_SearchServerConfiguration; ICM.admx DriverSearchPlaces_DontSearchWindowsUpdate"
note = "The copies below PolicyManager and WindowsUpdate\\UpdatePolicy (no policy, managed by Windows) dropped."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name = "ExcludeWUDriversInQualityUpdate", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DriverSearching', name = "SearchOrderConfig", dword = 2 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DriverSearching', name = "DontSearchWindowsUpdate", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DriverSearching', name = "DriverServerSelection", dword = 1 },
]

[[setting]]
id = "updates-notify-only"
category = "updates"
title = "Ask before downloading updates"
description = """Windows Update looks for updates and tells you, but downloads and installs nothing on its own. \
Costs: security updates wait until you start them."""
level = "optional"
hidden_if = ["updates-off"]
verified = "ADMX WindowsUpdate.admx AutoUpdateCfg (AUOptions 2 = notify for download and install)"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', name = "AUOptions", dword = 2 }]

[[setting]]
id = "feature-updates-defer"
category = "updates"
title = "Postpone feature updates for a year"
description = """New Windows versions are offered only 365 days after their release; monthly security updates \
keep coming."""
level = "optional"
hidden_if = ["updates-off"]
verified = "ADMX WindowsUpdate.admx DeferFeatureUpdates (DeferFeatureUpdatesPeriodInDays 0-365)"
note = "Pause values (no policy in 26H2) and PolicyManager copies are not set."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name = "DeferFeatureUpdates", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name = "DeferFeatureUpdatesPeriodInDays", dword = 365 },
]

# --- other programs and system -------------------------------------------------------------------------

[[category]]
id = "system"
title = "Developer tools and system"

[[setting]]
id = "dev-telemetry-off"
category = "system"
title = "PowerShell and .NET CLI send no telemetry"
description = """Sets the documented opt-out variables POWERSHELL_TELEMETRY_OPTOUT and DOTNET_CLI_TELEMETRY_OPTOUT \
for the whole machine, so PowerShell 7 and the dotnet command never send usage data."""
level = "recommended"
verified = "Microsoft Learn about_Telemetry (PowerShell) and \".NET SDK telemetry\": machine environment variables (Session Manager\\Environment)"
evidence = ["doc", "vm"]
ops = [
  { reg = 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment', name = "POWERSHELL_TELEMETRY_OPTOUT", sz = "1" },
  { reg = 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment', name = "DOTNET_CLI_TELEMETRY_OPTOUT", sz = "1" },
]

[[setting]]
id = "time-server-pool"
category = "system"
title = "Use pool.ntp.org as time server"
description = "Windows synchronizes the clock with the public NTP pool instead of time.windows.com."
level = "optional"
verified = "Microsoft Learn \"Windows Time service tools and settings\" (W32Time\\Parameters NtpServer; Type is NTP in the 26H2 image already)"
evidence = ["doc", "vm"]
ops = [
  { reg = 'HKLM\SYSTEM\CurrentControlSet\Services\W32Time\Parameters', name = "NtpServer", sz = "0.pool.ntp.org,0x9 1.pool.ntp.org,0x9 2.pool.ntp.org,0x9 3.pool.ntp.org,0x9" },
]

[[setting]]
id = "hibernation-off"
category = "system"
title = "Turn off hibernation"
description = """No hibernation file that keeps a copy of the memory on disk. Costs: no hibernate and no fast \
startup."""
level = "optional"
verified = "Control\\Power!HibernateEnabled (what powercfg -h off sets); VM: powercfg /a reports hibernation unavailable"
evidence = ["vm"]
ops = [{ reg = 'HKLM\SYSTEM\CurrentControlSet\Control\Power', name = "HibernateEnabled", dword = 0 }]

# --- further settings ----------------------------------------------------------------------------------------

[[setting]]
id = "diagtrack-autologger-off"
category = "telemetry"
title = "Turn off the telemetry boot logger"
description = """Disables the Diagtrack-Listener trace session, which records telemetry events from \
the start of boot for the telemetry service."""
level = "recommended"
verified = "Microsoft Learn \"Configuring and Starting an AutoLogger Session\" (Start 0 = session disabled); key present in the 26H2 image"
evidence = ["doc", "vm"]
ops = [{ reg = 'HKLM\SYSTEM\CurrentControlSet\Control\WMI\Autologger\Diagtrack-Listener', name = "Start", dword = 0 }]

[[setting]]
id = "tailored-experiences-off"
category = "advertising"
title = "No tailored experiences from diagnostic data"
description = "Microsoft does not use diagnostic data for personalized tips, ads and recommendations."
level = "recommended"
verified = "ADMX CloudContent.admx DisableTailoredExperiencesWithDiagnosticData (user)"
ops = [{ reg = 'HKCU\Software\Policies\Microsoft\Windows\CloudContent', name = "DisableTailoredExperiencesWithDiagnosticData", dword = 1 }]

[[setting]]
id = "user-tracking-off"
category = "activity"
title = "Turn off user tracking in Start and Explorer"
description = """Windows does not track which programs and documents you open to personalize Start and \
Explorer. Costs: no frequent and recent items there."""
level = "strict"
verified = "ADMX StartMenu.admx NoInstrumentation (user)"
ops = [{ reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoInstrumentation", dword = 1 }]

[[setting]]
id = "quick-access-history-off"
category = "explorer"
title = "No recent files and frequent folders in Explorer"
description = "Explorer's Home and Quick access list no recently used files and frequent folders. Costs: you navigate to them yourself."
level = "strict"
verified = "Settings switches (Explorer!ShowRecent, ShowFrequent, key present in the 26H2 default profile); VM: kept after setup"
evidence = ["vm"]
ops = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer', name = "ShowRecent", dword = 0 },
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer', name = "ShowFrequent", dword = 0 },
]

[[setting]]
id = "paint-ai-off"
category = "ai"
title = "No AI features in Paint"
description = "Paint offers no Image Creator, Cocreator and generative fill, which send prompts and images to Microsoft."
level = "recommended"
hidden_if = ["app-removed:Microsoft.Paint"]
verified = "ADMX WindowsCopilot.admx DisableImageCreator, DisableCocreator, DisableGenerativeFill"
note = "The Notepad AI switch and Explorer's AI actions menu have no policy in the 26H2 templates; not included."
ops = [
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint', name = "DisableImageCreator", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint', name = "DisableCocreator", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint', name = "DisableGenerativeFill", dword = 1 },
]

[[setting]]
id = "connected-devices-off"
category = "sync"
title = "Turn off the Connected Devices Platform"
description = """Disables the services that connect this PC with your phone and other devices through the \
Microsoft account. Costs: no Phone Link, Nearby sharing and cross-device experiences."""
level = "strict"
verified = "services CDPSvc and CDPUserSvc (per-user template) present in the 26H2 image; Microsoft Learn \"Per-user services\" (Start 4 on the template)"
ops = [{ service = "CDPSvc", start = 4 }, { service = "CDPUserSvc", start = 4 }]

[[setting]]
id = "user-data-services-off"
category = "sync"
title = "Turn off the contacts, calendar and mail data services"
description = """Disables the per-user services that store and hand out contacts, calendars and mail to apps. \
Costs: Mail, Calendar, People and apps that use them find no data."""
level = "strict"
verified = "per-user service templates UnistoreSvc and UserDataSvc present in the 26H2 image; Microsoft Learn \"Per-user services\""
ops = [{ service = "UnistoreSvc", start = 4 }, { service = "UserDataSvc", start = 4 }]

[[setting]]
id = "smart-name-resolution-off"
category = "network-checks"
title = "Ask DNS only on the preferred network"
description = """Windows does not send name queries over all network adapters at once, so lookups made through \
a VPN do not leak to the local network."""
level = "recommended"
verified = "ADMX DnsClient.admx DNS_SmartMultiHomedNameResolution"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient', name = "DisableSmartNameResolution", dword = 1 }]

[[setting]]
id = "delivery-optimization-lan-only"
category = "network-checks"
title = "Peer-to-peer downloads only within the local network"
description = """Windows Update and the Store may share downloads with PCs on the same network, never with PCs \
on the internet. An alternative to downloading only from Microsoft."""
level = "optional"
conflicts = ["delivery-optimization-http-only"]
verified = "ADMX DeliveryOptimization.admx DownloadMode (1 = LAN)"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization', name = "DODownloadMode", dword = 1 }]

[[setting]]
id = "password-reveal-off"
category = "hardening"
title = "No password reveal button"
description = "Password fields do not offer the eye button that shows the typed password."
level = "recommended"
verified = "ADMX CredUI.admx DisablePasswordReveal"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CredUI', name = "DisablePasswordReveal", dword = 1 }]

[[setting]]
id = "pagefile-clear"
category = "hardening"
title = "Clear the page file at shutdown"
description = "The page file, which can hold fragments of memory such as passwords, is wiped on every shutdown. Costs: shutting down takes longer."
level = "optional"
verified = "Microsoft Learn security policy \"Shutdown: Clear virtual memory pagefile\" (Memory Management!ClearPageFileAtShutdown); VM p3: reset by setup's security template (INF/defltwk.inf), so written again after setup"
evidence = ["doc", "vm"]
ops = [{ reg = 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', name = "ClearPageFileAtShutdown", dword = 1, after_setup = true }]

[[setting]]
id = "onedrive-pre-signin-off"
category = "sync"
title = "OneDrive stays offline until sign-in"
description = "OneDrive generates no network traffic before a user signs in to it."
level = "recommended"
hidden_if = ["onedrive-removed"]
verified = "ADMX SkyDrive.admx PreventNetworkTrafficPreUserSignIn"
ops = [{ reg = 'HKLM\SOFTWARE\Microsoft\OneDrive', name = "PreventNetworkTrafficPreUserSignIn", dword = 1 }]

[[setting]]
id = "retail-demo-off"
category = "system"
title = "Turn off the retail demo service"
description = "Disables the service for the shop demo mode, which is never needed on a personal PC."
level = "recommended"
verified = "service RetailDemo present in the 26H2 image"
ops = [{ service = "RetailDemo", start = 4 }]
