# lean11 privacy catalog. Format and rules: docs/PRIVACY.md.
#
# Levels: recommended = no visible feature lost; strict = costs a feature (named in the description);
# optional = special cases. `verified` names the evidence for Windows 11 26H2 (ADMX = the policy
# template shipped in the image's PolicyDefinitions, checked by `lean11 privacy verify`).

# ---------------------------------------------------------------------------------------------------
[[category]]
id = "data-collection"
title = "Data collection"

[[category]]
id = "telemetry"
title = "Diagnostic data (telemetry)"
parent = "data-collection"

[[category]]
id = "ceip"
title = "Customer Experience Improvement Program"
parent = "data-collection"

[[category]]
id = "app-compat"
title = "Application compatibility telemetry"
parent = "data-collection"

[[category]]
id = "error-reporting"
title = "Error reporting"
parent = "data-collection"

# --- telemetry ---------------------------------------------------------------------------------------

[[setting]]
id = "diagnostic-data-off"
category = "telemetry"
title = "Diagnostic data: lowest level"
description = """Sets the Group Policy "Allow diagnostic data" to its lowest level. Enterprise and Education \
send no diagnostic data at all; Home and Pro fall back to the required minimum, which Windows does not allow \
to switch off on these editions. Replaces the level "Required" that the Components option "Optional \
diagnostics and personalization" sets."""
level = "recommended"
verified = "ADMX DataCollection.admx AllowTelemetry (0 = Diagnostic data off, Enterprise/Education only), ConfigureTelemetryOptInChangeNotification"
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowTelemetry", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "DisableTelemetryOptInChangeNotification", dword = 1 },
]

[[setting]]
id = "diagtrack-service-off"
category = "telemetry"
title = "Turn off the telemetry service (DiagTrack)"
description = """Disables "Connected User Experiences and Telemetry", the service that collects and uploads \
diagnostic data, so nothing is sent even where the policy cannot go below the required level."""
level = "recommended"
verified = "service DiagTrack present in the 26H2 image (automatic)"
ops = [{ service = "DiagTrack", start = 4 }]

[[setting]]
id = "wap-push-service-off"
category = "telemetry"
title = "Turn off the WAP push message routing service"
description = """Disables dmwappushservice, which routes device-management push messages. Only needed when \
the PC is managed by an MDM such as Intune."""
level = "recommended"
verified = "service dmwappushservice present in the 26H2 image"
ops = [{ service = "dmwappushservice", start = 4 }]

[[setting]]
id = "diagnostic-data-processing-off"
category = "telemetry"
title = "Opt out of cloud processing of diagnostic data"
description = """Tells Windows that no Microsoft cloud service (Windows Update for Business reports, Update \
Compliance, Desktop Analytics, the commercial data pipeline) may process this device's diagnostic data, and \
leaves the device name out of it."""
level = "recommended"
verified = "ADMX DataCollection.admx: AllowDesktopAnalyticsProcessing, AllowWUfBCloudProcessing, AllowUpdateComplianceProcessing, AllowCommercialDataPipeline, AllowDeviceNameInDiagnosticData"
note = "MicrosoftEdgeDataOptIn is not set: no policy in 26H2 (Desktop Analytics retired)."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowDesktopAnalyticsProcessing", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowWUfBCloudProcessing", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowUpdateComplianceProcessing", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowCommercialDataPipeline", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "AllowDeviceNameInTelemetry", dword = 0 },
]

[[setting]]
id = "diagnostic-logs-limit"
category = "telemetry"
title = "Limit diagnostic log and memory dump collection"
description = """Keeps Windows from collecting additional diagnostic logs and full memory dumps for \
diagnostic data, even when the diagnostic level would allow it."""
level = "recommended"
sources = ["ADMX DataCollection"]
verified = "ADMX DataCollection.admx: LimitDiagnosticLogCollection, LimitDumpCollection"
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "LimitDiagnosticLogCollection", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "LimitDumpCollection", dword = 1 },
]

[[setting]]
id = "onesettings-downloads-off"
category = "telemetry"
title = "Do not download configuration from OneSettings"
description = """Stops Windows from downloading service configuration (OneSettings) from Microsoft. Costs: \
components that Microsoft tunes remotely keep their built-in defaults."""
level = "strict"
verified = "ADMX DataCollection.admx DisableOneSettingsDownloads"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name = "DisableOneSettingsDownloads", dword = 1 }]

[[setting]]
id = "device-census-off"
category = "telemetry"
title = "Turn off the device census tasks"
description = """Disables the scheduled tasks that run DeviceCensus.exe to collect device and configuration \
data for Microsoft."""
level = "recommended"
verified = "tasks present in the 26H2 image TaskCache"
ops = [
  { task = '\Microsoft\Windows\Device Information\Device' },
  { task = '\Microsoft\Windows\Device Information\Device User' },
]

[[setting]]
id = "license-telemetry-off"
category = "telemetry"
title = "Turn off KMS client online validation"
description = """Stops the Software Protection Platform from sending license validation data (the "AVS" \
ticket) to Microsoft. Activation itself is unaffected."""
level = "recommended"
verified = "ADMX AVSValidationGP.admx NoAcquireGT (NoGenTicket)"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform', name = "NoGenTicket", dword = 1 }]

# --- customer experience improvement program ---------------------------------------------------------

[[setting]]
id = "ceip-off"
category = "ceip"
title = "Opt out of the Customer Experience Improvement Program"
description = """Turns off the Windows Customer Experience Improvement Program for all users and disables \
its data collection tasks (consolidator, kernel, USB and disk check data)."""
level = "recommended"
verified = "ADMX ICM.admx CEIPEnable; tasks present in the 26H2 image TaskCache"
note = "The older BthSQM, Uploader and Server* tasks do not exist in 26H2."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\SQMClient\Windows', name = "CEIPEnable", dword = 0 },
  { task = '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator' },
  { task = '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask' },
  { task = '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip' },
  { task = '\Microsoft\Windows\Autochk\Proxy' },
]

[[setting]]
id = "disk-diagnostic-collector-off"
category = "ceip"
title = "Turn off disk diagnostic data collection"
description = """Disables the task that collects disk and system information for Microsoft when the \
Diagnostic Policy Service reports a disk problem."""
level = "recommended"
verified = "task present in the 26H2 image TaskCache"
ops = [{ task = '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector' }]

# --- application compatibility -----------------------------------------------------------------------

[[setting]]
id = "app-telemetry-off"
category = "app-compat"
title = "Turn off application telemetry and inventory"
description = """Stops Application Impact Telemetry and the Inventory Collector, which record which programs \
are installed and how they are used, and disables the compatibility appraiser and program data tasks."""
level = "recommended"
verified = "ADMX AppCompat.admx AppCompatTurnOffApplicationImpactTelemetry, AppCompatTurnOffProgramInventory; tasks present in the 26H2 image TaskCache"
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "AITEnable", dword = 0 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "DisableInventory", dword = 1 },
  { task = '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser' },
  { task = '\Microsoft\Windows\Application Experience\ProgramDataUpdater' },
  { task = '\Microsoft\Windows\Application Experience\AitAgent' },
]

[[setting]]
id = "steps-recorder-off"
category = "app-compat"
title = "Turn off Steps Recorder"
description = """Disables Steps Recorder, which captures screenshots, clicks and keystrokes to document a \
problem."""
level = "recommended"
verified = "ADMX AppCompat.admx AppCompatTurnOffUserActionRecord"
ops = [{ reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "DisableUAR", dword = 1 }]

[[setting]]
id = "compat-assistant-off"
category = "app-compat"
title = "Turn off the Program Compatibility Assistant"
description = """Disables the assistant (policy and PcaSvc service) that watches programs for known \
compatibility problems and offers fixes. Costs: no automatic compatibility hints for old programs."""
level = "strict"
verified = "ADMX AppCompat.admx AppCompatTurnOffProgramCompatibilityAssistant_2; service PcaSvc present in the 26H2 image"
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "DisablePCA", dword = 1 },
  { service = "PcaSvc", start = 4 },
]

[[setting]]
id = "compat-tasks-off"
category = "app-compat"
title = "Turn off the startup app and app backup data tasks"
description = """Disables StartupAppTask (checks autostart programs) and MareBackup (gathers Win32 \
application data with CompatTelRunner). Costs: no warning about many autostart programs."""
level = "strict"
verified = "tasks present in the 26H2 image TaskCache"
note = "The older PcaPatchDbTask does not exist in 26H2."
ops = [
  { task = '\Microsoft\Windows\Application Experience\StartupAppTask' },
  { task = '\Microsoft\Windows\Application Experience\MareBackup' },
]

[[setting]]
id = "compat-engine-off"
category = "app-compat"
title = "Turn off the application compatibility engine"
description = """Switches off the compatibility shims entirely. Old programs that rely on a shim can stop \
working or behave differently, and the "Compatibility" tab loses its effect. Only for systems that run \
current software."""
level = "optional"
verified = "ADMX AppCompat.admx AppCompatTurnOffEngine, AppCompatRemoveProgramCompatPropPage"
note = "Optional because it breaks programs that depend on compatibility shims."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "DisableEngine", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name = "DisablePropPage", dword = 1 },
]

# --- error reporting ---------------------------------------------------------------------------------

[[setting]]
id = "error-reporting-off"
category = "error-reporting"
title = "Turn off Windows Error Reporting"
description = """Stops Windows from sending crash and problem reports to Microsoft. Costs: no online \
solutions for problems in the Security and Maintenance control panel."""
level = "recommended"
verified = "ADMX ErrorReporting.admx WerDisable_2, WerNoSecondLevelData_2, WerNoLogging_2, WerAutoApproveOSDumps_2; task present in the 26H2 image TaskCache"
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', name = "Disabled", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', name = "DontSendAdditionalData", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', name = "LoggingDisabled", dword = 1 },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', name = "AutoApproveOSDumps", dword = 0 },
  { task = '\Microsoft\Windows\Windows Error Reporting\QueueReporting' },
]

[[setting]]
id = "error-reporting-service-off"
category = "error-reporting"
title = "Turn off the Windows Error Reporting service"
description = """Disables WerSvc as well. Costs: crash dumps of programs are no longer collected locally \
either, which makes troubleshooting harder."""
level = "strict"
sources = ["own"]
verified = "service WerSvc present in the 26H2 image"
ops = [{ service = "WerSvc", start = 4 }]

# --- app permissions -----------------------------------------------------------------------------

[[category]]
id = "app-permissions"
title = "App permissions"
parent = "data-collection"
description = "Device-wide denials for Store apps, the same switches as Settings > Privacy & security > App permissions."

[[setting]]
id = "app-access-location"
category = "app-permissions"
title = "Deny apps access to location"
description = "Apps cannot read the device location. Costs: no automatic time zone, local weather or Find my device."
level = "strict"
verified = "ADMX AppPrivacy.admx LetAppsAccessLocation; ConsentStore device switch (written by Settings; kept after setup: VM test); VM p8: setup with every privacy switch on (ProtectYourPC 1) sets the device switch to Allow, so it is written again after setup (the policy denies access either way)"
evidence = ["vm"]
note = "Only the policy value; the three app lists of the ADMX element stay empty."
ops = [
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy', name = "LetAppsAccessLocation", dword = 2 },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location', name = "Value", sz = "Deny", after_setup = true },
]

