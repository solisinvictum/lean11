effect = "No recovery boot: a system that no longer starts can only be repaired from installation media, and Reset this PC is unavailable. Setup uses the legacy installer. Irreversible for the installed system."
verified = "VM Core"

[[entry]]
kind = "option"
match = ["trim-winsxs"]
rating = "limited"
what = "The component store (WinSxS) except common controls, GDI+, the C runtime and servicing."
effect = "Windows runs, but it can no longer be updated (cumulative updates fail), repaired (DISM, SFC) or get features and languages added. Setup uses the legacy installer. Irreversible."
verified = "VM Core"

