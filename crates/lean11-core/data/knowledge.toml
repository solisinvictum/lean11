# lean11 knowledge base: safety rating and description per catalog option, privacy setting and inventory
# item. Format: docs/KNOWLEDGE.md.
#
# rating: safe    = setup and Windows keep working; only the named item goes, nothing else depends on it.
#         limited = setup and Windows keep working, but other functions or apps that build on it are impaired.
#         breaks  = setup or Windows itself fails, or the PC is unusable (no keyboard or mouse input); proven by a
#                   test install or documented by Microsoft.
# match:  case-insensitive patterns (`*` = any text) against the identity (option id, privacy id, package,
#         service name, ...) or the readable name; the most specific match wins.
# verified: the evidence. "VM Lean" = the Lean preset (every app option, edge-files, onedrive-files, xps,
#         workfolders, legacy, recall-feature and every policy option) installed and checked in test VMs
#         b8, p7, p9 and pw; "VM Core" = the Core preset installed and booted in VM b5.

