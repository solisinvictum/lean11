[[entry]]
kind = "option"
match = ["disable-windows-update"]
rating = "limited"
what = "Windows Update, the update orchestrator, the update repair service and update access by policy."
effect = "No security or quality updates, no driver updates and no Defender signature updates through Windows Update. Reversible."
verified = "VM Core"

[[entry]]
kind = "option"
match = ["remove-winre"]
rating = "limited"
