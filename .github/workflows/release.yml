# Builds lean11 for Linux x86_64, macOS arm64 and Windows x64 on every version tag (v*) and attaches the archives
# and their SHA-256 files to the GitHub release of that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# the macOS binary runs on macOS 11 and newer, whatever runner version builds it
env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lean11
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v="dev-${GITHUB_SHA::7}"
          d="lean11-$v-${{ matrix.name }}"
          mkdir "$d"
          cp README.md LICENSE "$d/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/lean11.exe" "$d/"
            7z a -tzip "$d.zip" "$d" >/dev/null
            f="$d.zip"
          else
            cp "target/${{ matrix.target }}/release/lean11" "$d/"
            tar czf "$d.tar.gz" "$d"
            f="$d.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          echo "ASSET=$f" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
